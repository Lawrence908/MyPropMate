services:
  # ===================
  # MyPropMate API
  # ===================
  mypropmate-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mypropmate-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    # All secrets/config come from the repo-root .env (IMAP_*, SMTP_*, etc.).
    env_file:
      - .env
    environment:
      # Unbuffered stdout so lifespan/poll logs appear in `docker compose logs`.
      - PYTHONUNBUFFERED=1
      # Container paths (match Settings defaults; kept explicit for clarity).
      - TEMPLATE_PATH=/app/templates/rental_receipt_template.xlsx
      - RECEIPTS_DIR=/app/receipts
      - DB_PATH=/app/data/mypropmate.db
      - TENANTS_SEED_PATH=/app/data/tenants.json
      - SOFFICE_BIN=soffice
      - POLL_INTERVAL_MINUTES=${POLL_INTERVAL_MINUTES:-5}
    volumes:
      # Persist the SQLite DB and host-edit tenants.json here.
      - ./backend/data:/app/data
      # Generated receipts (xlsx + pdf) land on the host.
      - ./receipts:/app/receipts
      # Edit the receipt template without rebuilding the image.
      - ./backend/templates:/app/templates:ro
    networks:
      - mypropmate-network

networks:
  mypropmate-network:
    driver: bridge
